[package]
name = "mnemoa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keep repo memory for coding agents small, true and enforced (library)."

[lints]
workspace = true

[features]
default = ["tiktoken"]
# Real o200k_base token counts. Without it, tokens are estimated as bytes / 4.
tiktoken = ["dep:tiktoken-rs"]

[dependencies]
gix = { version = "0.87.1", default-features = false, features = ["sha1", "revision", "blob-diff"] }
globset = "0.4.19"
ignore = "0.4.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"
tiktoken-rs = { version = "0.12.1", optional = true }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

