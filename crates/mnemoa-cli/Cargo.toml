[package]
name = "mnemoa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Command-line interface for mnemoa."

[[bin]]
name = "mnemoa"
path = "src/main.rs"

[features]
# Enable the LLM drafter for `mnemoa promote --llm` (network access).
llm = ["mnemoa-core/llm"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
mnemoa-core = { version = "0.1.0", path = "../mnemoa-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde_json = "1.0.154"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
