[package]
name = "mnemoa-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "HTTP API server for mnemoa."

[features]
# Allow `llm: true` on /promote (network access to the configured model).
llm = ["mnemoa-core/llm"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
mnemoa-core = { version = "0.1.0", path = "../mnemoa-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
