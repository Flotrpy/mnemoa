[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemoa-sdk"
version = "0.1.0"
description = "Python client for mnemoa: keep repo memory for coding agents small, true and enforced."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/Flotrpy/mnemoa"

[tool.setuptools]
packages = ["mnemoa"]

[tool.setuptools.package-data]
mnemoa = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
