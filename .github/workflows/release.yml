name: Release

# Two ways to publish a GitHub release with prebuilt binaries:
# - push a tag like v0.1.0 that matches [workspace.package] version in Cargo.toml, or
# - Actions > Release > Run workflow on `main` with "Publish" ticked: the release is tagged
#   at that commit, named after the Cargo.toml version.
# A manual run without "Publish" (or from any other branch or tag) is a dry run that builds
# and packages every target without publishing. Nothing is published to crates.io, PyPI or
# a container registry.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (main only). Leave unticked for a dry run.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check tag and changelog
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: decide whether this run publishes
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          publish=false
          if [ "$EVENT" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            publish=true
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$PUBLISH_INPUT" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Publish is only allowed from main (this run is on $GITHUB_REF)"
              exit 1
            fi
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "publish: $publish"
      - name: tag matches the workspace version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: changelog has a section for the version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! grep -q "^## $TAG\b" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $TAG' section"
            exit 1
          fi
      - name: no release exists for the version yet
        if: github.event_name == 'workflow_dispatch' && steps.mode.outputs.publish == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag $TAG already exists; bump [workspace.package] version in Cargo.toml and add a CHANGELOG.md section first"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::a release named $TAG already exists"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.check.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p mnemoa-cli -p mnemoa-api --features mnemoa-cli/llm,mnemoa-api/llm
      - name: smoke test
        run: |
          bin=target/${{ matrix.target }}/release
          "$bin/mnemoa" --version | grep -q "${TAG#v}"
          "$bin/mnemoa" scan .
          test -x "$bin/mnemoa-api"
      - name: package
        run: |
          name="mnemoa-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/mnemoa" "target/${{ matrix.target }}/release/mnemoa-api" \
            LICENSE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          rm -r "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [check, build]
    # A tag push, or a manual run on main with "Publish" ticked; anything else is a dry run.
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release notes from CHANGELOG.md
        run: |
          awk -v tag="## $TAG" '
            index($0, tag) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # The pushed tag already exists.
            target=(--verify-tag)
          else
            # Creates the tag at the commit this run built.
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$TAG" dist/* \
            --title "mnemoa $TAG" \
            --notes-file notes.md \
            "${target[@]}"
