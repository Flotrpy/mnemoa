[workspace]
resolver = "3"
members = ["crates/mnemoa-core", "crates/mnemoa-cli", "crates/mnemoa-api", "crates/mnemoa-bench"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Flotrpy/mnemoa"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
