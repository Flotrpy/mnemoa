# mnemoa API plus an optional Ollama for the LLM drafter.
#   docker compose up -d
#   docker exec mnemoa-ollama ollama pull qwen2.5-coder:7b   # only if you enable the drafter
#   curl http://localhost:8080/health
services:
  mnemoa:
    build: .
    image: mnemoa:local
    container_name: mnemoa
    ports:
      - "${MNEMOA_PORT:-8080}:8080"
    environment:
      MNEMOA_ROOT: /workspace
      MNEMOA_PORT: "8080"
      MNEMOA_TARGETS: ${MNEMOA_TARGETS:-claude-code,codex,cursor}
      MNEMOA_API_ALLOW_WRITE: ${MNEMOA_API_ALLOW_WRITE:-false}
      MNEMOA_LLM_ENABLED: ${MNEMOA_LLM_ENABLED:-false}
      MNEMOA_LLM_PROVIDER: ${MNEMOA_LLM_PROVIDER:-ollama}
      MNEMOA_LLM_BASE_URL: ${MNEMOA_LLM_BASE_URL:-http://ollama:11434/v1}
      MNEMOA_LLM_MODEL: ${MNEMOA_LLM_MODEL:-qwen2.5-coder:7b}
      MNEMOA_LLM_API_KEY: ${MNEMOA_LLM_API_KEY:-ollama}
    volumes:
      # The repository to analyze. Read-only unless MNEMOA_API_ALLOW_WRITE=true and you drop :ro.
      - ${MNEMOA_WORKSPACE:-.}:/workspace/repo:ro
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mnemoa-ollama
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
